set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi

set -g extended-keys on
set -g extended-keys-format csi-u

set -g pane-border-lines heavy
set -g window-style "bg=default"
set -g window-active-style "bg=default"

set-option -g prefix C-j
set-option -g prefix2 C-f

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

set-option -g status on
set-option -g status-left-length 28
set-option -g status-right-length 64
set-option -g window-status-separator ""

bind t run-shell "$HOME/dotfiles/scripts/theme-toggle.sh" \; display-message "theme toggled"

bind T display-popup -E -w 38 -h 15 -T " now " \
  "$HOME/dotfiles/tmux/bin/clock-popup.sh"

bind u if -F '#{@usage_hidden}' \
  'set -gu @usage_hidden ; refresh-client -S ; display-message "usage shown"' \
  'set -g @usage_hidden 1 ; refresh-client -S ; display-message "usage hidden"'

bind S if -F '#{@status_show_all}' \
  'set -gu @status_show_all ; refresh-client -S ; display-message "status: default"' \
  'set -g @status_show_all 1 ; refresh-client -S ; display-message "status: all fields"'

set -g @theme_auto_client 'on'
set -g @theme_desktop 'light'
set -g @theme_mobile_peers ''
set-hook -g 'client-attached[998]' 'run -b "$HOME/dotfiles/tmux/bin/client-theme.sh --attached #{client_tty}"'
set-hook -g 'client-detached[998]' 'run -b "$HOME/dotfiles/tmux/bin/client-theme.sh --detached #{client_tty}"'
set-hook -g 'client-active[998]'   'run -b "$HOME/dotfiles/tmux/bin/client-theme.sh --active #{client_tty}"'
set-hook -g 'client-focus-in[998]' 'run -b "$HOME/dotfiles/tmux/bin/client-theme.sh --active #{client_tty}"'

set -g pane-border-status top
set -g pane-border-format ' #{?@pane_label,#{@pane_label},#(pgrep -P #{pane_pid} | xargs -r ps -o args= -p | head -n1)} '
bind C command-prompt -I "#{@pane_label}" -p "pane label:" 'set -p @pane_label "%1"'

bind o run-shell -b "$HOME/dotfiles/tmux/bin/open-pr.sh '#{pane_id}'"

set-hook -g 'session-window-changed[999]' 'set-window-option -q @agent_awaiting 0'
set-hook -g 'pane-focus-in[999]' { if -F '#{==:#{@agent_pane_state},awaiting}' { set-option -pqu @agent_pane_state } }

run-shell "$HOME/dotfiles/tmux/bin/apply-theme.sh"

if-shell -F '#{!=:#{@agent_init_done},1}' \
  'set-option -g @agent_init_done 1 ; run-shell -b "$HOME/dotfiles/tmux/bin/agent-clear-all.sh"'

bind c command-prompt -p "window name:" 'new-window -n "%1" -c "#{pane_current_path}"'
bind w run-shell -b "tmux display-popup -c '#{client_name}' -E -w 95% -h 95% -T ' windows ' \
  \"$HOME/dotfiles/tmux/bin/window-chooser.sh '#{session_name}:' '#{client_name}'\""
bind s run-shell -b "tmux display-popup -c '#{client_name}' -E -w 95% -h 95% -T ' sessions ' \
  \"$HOME/dotfiles/tmux/bin/window-chooser.sh --all '#{session_name}:' '#{client_name}'\""

bind v split-window -h -c "#{pane_current_path}" \; select-layout -E
bind h split-window -v -c "#{pane_current_path}" \; select-layout -E
set-hook -g pane-died 'run -b "tmux select-layout -E; $HOME/dotfiles/tmux/bin/agent-window-flags.sh #{window_id}"'
set-hook -g pane-exited 'run -b "tmux select-layout -E; $HOME/dotfiles/tmux/bin/agent-window-flags.sh #{window_id}"'
set-hook -g after-kill-pane 'select-layout -E ; run -b "$HOME/dotfiles/tmux/bin/agent-window-flags.sh #{window_id}"'

bind -n C-z resize-pane -Z
bind -n C-Up resize-pane -Z
unbind z

bind -n C-x run-shell "$HOME/dotfiles/tmux/bin/half-zoom.sh #{pane_id} #{window_id} y"
bind -n C-y run-shell "$HOME/dotfiles/tmux/bin/half-zoom.sh #{pane_id} #{window_id} x"

bind -n C-_ if-shell -F "#{pane_in_mode}" "send-keys -X cancel" "copy-mode"

bind x kill-pane \; select-layout -E
bind X confirm-before -p "kill ALL other panes in #W? (y/n)" 'kill-pane -a'

bind b run-shell 'tmux break-pane -s "#{pane_id}" 2>/dev/null; tmux select-layout -t "#{window_id}" -E 2>/dev/null; true'

bind B run-shell 'new=$(tmux new-session -dP -F "##{session_name}"); tmux join-pane -s "#{pane_id}" -t "$new:"; tmux kill-pane -a -t "#{pane_id}"; tmux switch-client -t "$new"; tmux select-layout -t "#{window_id}" -E 2>/dev/null; true'

bind A run-shell -b "$HOME/dotfiles/tmux/bin/pane-to-alacritty.sh '#{pane_id}' '#{window_id}' '#{pane_current_path}'"

bind G run-shell "$HOME/dotfiles/tmux/bin/window-to-default-session.sh '#{window_id}' '#{session_name}' '#{client_tty}'"

bind F display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " attach file " \
  "$HOME/dotfiles/tmux/bin/attach-file.sh"

bind P display-popup -E -w 90% -h 90% -T " attach photo " \
  "$HOME/dotfiles/tmux/bin/attach-photo.sh"

set -g @clip_ssh_users 'home=wu kojimachi=ji'
bind V run-shell -b "$HOME/dotfiles/tmux/bin/paste-image.sh '#{pane_id}'"

bind -n C-h select-pane -L
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

bind -n C-Down run-shell -b "tmux display-popup -c '#{client_name}' -E -w 95% -h 95% -T ' windows ' \
  \"$HOME/dotfiles/tmux/bin/window-chooser.sh '#{session_name}:' '#{client_name}'\""
bind -n C-Right switch-client -T prefix

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n C-p previous-window
bind -n C-n next-window

set -s user-keys[2] "\e[122~"
set -s user-keys[3] "\e[123~"
set -s user-keys[4] "\e[124~"
set -s user-keys[5] "\e[125~"
set -s user-keys[6] "\e[126~"
set -s user-keys[7] "\e[127~"
set -s user-keys[8] "\e[128~"
set -s user-keys[9] "\e[129~"
set -s user-keys[10] "\e[130~"
bind -n User2 select-window -t :=0
bind -n User3 select-window -t :=1
bind -n User4 select-window -t :=2
bind -n User5 select-window -t :=3
bind -n User6 select-window -t :=4
bind -n User7 select-window -t :=5
bind -n User8 select-window -t :=6
bind -n User9 select-window -t :=7
bind -n User10 select-window -t :$

bind -n C-S-Left swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

bind -r n switch-client -n

set -s user-keys[0] "\e[120~"
set -s user-keys[1] "\e[121~"
bind -n User0 switch-client -n
bind -n User1 switch-client -p

bind -T root F12 \
  set prefix None \;\
  set prefix2 None \;\
  set key-table off \;\
  set mouse off \;\
  set status-left-length 20 \;\
  set status-left '#{E:@off_chip}' \;\
  set status-right '' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u prefix2 \;\
  set -u key-table \;\
  set -u mouse \;\
  set -u status-left-length \;\
  set -u status-left \;\
  set -u status-right \;\
  refresh-client -S

bind y set-window-option synchronize-panes\; display-message "synchronize mode toggled."

set -g @copy_helper "$HOME/dotfiles/tmux/bin/osc52-copy.sh"
set -g @unwrap_helper "$HOME/dotfiles/tmux/bin/unwrap-lines.sh"
set -g @mermaid_helper "$HOME/dotfiles/tmux/bin/mermaid-open.sh"

bind-key -T copy-mode-vi y send-keys -X copy-selection \; run-shell -b "tmux save-buffer - | #{@copy_helper} #{q:client_tty} #{q:client_termname}"
bind-key -T copy-mode-vi Y set -s set-clipboard off \; send-keys -X copy-selection \; set -s set-clipboard on \; run-shell -b "tmux save-buffer - | #{@unwrap_helper} | #{@copy_helper} #{q:client_tty} #{q:client_termname}"
bind-key -T copy-mode-vi Enter send-keys -X copy-selection \; run-shell -b "tmux save-buffer - | #{@copy_helper} #{q:client_tty} #{q:client_termname}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection \; send-keys -X copy-selection-no-clear \; run-shell -b "tmux save-buffer - | #{@copy_helper} #{q:client_tty} #{q:client_termname}"
bind m set -s set-clipboard off \; send-keys -X copy-selection-no-clear \; set -s set-clipboard on \; run-shell -b "tmux save-buffer - | #{@mermaid_helper} '#{pane_id}' #{q:client_tty} #{q:client_termname}"

set -g focus-events on

set -g allow-passthrough on
set -s set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:clipboard'
set -as terminal-features ',*:RGB'
set -ag terminal-overrides ',*:Ms=\\E]52;c;%p2%s\\7'

set -ga update-environment " SSH_CONNECTION SSH_CLIENT SSH_TTY"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'genkio/tmux-open-usage'
set -g @plugin 'genkio/tmux-spoony'
set -g @plugin 'genkio/tmux-gh-pr'
set -g @gh-pr-label 'Ready for review'
set -g @gh-pr-exclude-approved 'on'
set -g @gh-pr-key 'p'
set -g @tmux_open_usage_enabled 'off'
set -g @tmux_open_usage_claude_view 'all'
set -g @tmux_open_usage_codex_view 'all'
set -g @tmux_open_usage_claude_fable 'on'
set -g @tmux_open_usage_refresh_interval_minutes '5'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-restore-all "$HOME/dotfiles/tmux/bin/agent-clear-all.sh"

if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'" 'display-message "TPM missing: clone ~/.tmux/plugins/tpm, then press prefix + I"'
