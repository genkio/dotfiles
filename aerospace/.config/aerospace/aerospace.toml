config-version = 2

after-startup-command = [
  'exec-and-forget $HOME/.config/aerospace/scripts/startup.sh',
]

exec-on-workspace-change = [
  '/bin/bash', '-c',
  '$HOME/.config/aerospace/scripts/sync.sh',
]

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['exec-and-forget $HOME/.config/aerospace/scripts/sync.sh']
automatically-unhide-macos-hidden-apps = false
focus-follows-mouse.enabled = true
key-mapping.preset = 'qwerty'

persistent-workspaces = ["1", "2", "3", "4"]

gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     40
gaps.outer.top =        8
gaps.outer.right =      8

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'

[mode.rcmd.binding]
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    0 = 'balance-sizes'

    '1' = 'workspace 1'
    '2' = 'workspace 2'
    '3' = 'workspace 3'
    '4' = 'workspace 4'

    'shift-1' = 'move-node-to-workspace 1'
    'shift-2' = 'move-node-to-workspace 2'
    'shift-3' = 'move-node-to-workspace 3'
    'shift-4' = 'move-node-to-workspace 4'

    shift-tab = 'move-workspace-to-monitor --wrap-around next'

    tab = 'workspace-back-and-forth'

    enter = 'exec-and-forget $HOME/.config/aerospace/scripts/fullscreen-toggle.sh'

    a = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh Alacritty'
    c = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh Calendar'
    f = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh Finder'
    h = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh Helium'
    m = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh Mail'
    p = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh Preview'
    s = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh "Sublime Text"'
    t = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh TablePlus'
    w = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh WeChat'
    z = 'exec-and-forget $HOME/.config/aerospace/scripts/launch.sh Firefox'
